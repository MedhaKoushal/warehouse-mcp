[project]
name = "warehouse-mcp"
version = "0.1.0"
description = "Read-Only PostgreSQL MCP Server via SSM Tunnel & AWS IAM Auth"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "pg8000>=1.30",
    "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = ["server"]
